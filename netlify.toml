# O site (pasta "site") e as funções (netlify/functions) ficam no MESMO endereço.
# Assim o navegador chama /api/... sem CORS. O .env nunca é publicado.
[build]
  publish = "site"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
