# O site (pasta "site") e as funções (netlify/functions) ficam no MESMO endereço.
# Assim o navegador chama /api/... sem CORS. O .env nunca é publicado.
[build]
  publish = "site"

[functions]
  node_bundler = "esbuild"

# Painel do vendedor: /admin abre site/admin.html. Fora do Google e sem cache.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Cabeçalhos de segurança em todas as páginas.
# O navegador só carrega scripts/estilos/fontes dos endereços listados abaixo.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# Fontes e ícones mudam raramente: o navegador guarda por 1 ano.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Nunca servir arquivos sensíveis, mesmo que alguém coloque na pasta publicada por engano.
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/*.map"
  to = "/404.html"
  status = 404
  force = true
